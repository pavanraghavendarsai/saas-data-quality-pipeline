[project]
name = "saas-production-grade-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Your Name", email = "your-email@example.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.1.1",
    "psycopg[binary,pool]>=3.3.9",
    "sqlalchemy>=2.1.9",
]

[project.scripts]
saas-production-grade-project = "saas_production_grade_project:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pgcli>=4.7.1",
]
